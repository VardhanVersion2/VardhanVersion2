<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Applied machine learning workflow</title><desc id="d">Five stages: data, cleaning, features, model, evaluation.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071225"/><stop offset="1" stop-color="#111c3c"/></linearGradient><linearGradient id="arr"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)" stroke="#1e40af" stroke-opacity=".55"/><text x="52" y="55" fill="#93c5fd" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="4">APPLIED MACHINE LEARNING</text><text x="52" y="88" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">A reproducible workflow, not just a model file.</text><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><g transform="translate(42 128)"><rect width="190" height="112" rx="15" fill="#10264b" stroke="#3b82f6"/><text x="95" y="42" fill="#7dd3fc" font-size="14" font-weight="700">01</text><text x="95" y="72" fill="#fff" font-size="21" font-weight="700">DATA</text><text x="95" y="94" fill="#bfdbfe" font-size="12">Inspect &amp; understand</text></g><path d="M240 184h30m-10-9 10 9-10 9" stroke="url(#arr)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(280 128)"><rect width="190" height="112" rx="15" fill="#10264b" stroke="#0ea5e9"/><text x="95" y="42" fill="#7dd3fc" font-size="14" font-weight="700">02</text><text x="95" y="72" fill="#fff" font-size="21" font-weight="700">CLEAN</text><text x="95" y="94" fill="#bfdbfe" font-size="12">Validate &amp; transform</text></g><path d="M478 184h30m-10-9 10 9-10 9" stroke="url(#arr)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(518 128)"><rect width="190" height="112" rx="15" fill="#10264b" stroke="#06b6d4"/><text x="95" y="42" fill="#67e8f9" font-size="14" font-weight="700">03</text><text x="95" y="72" fill="#fff" font-size="21" font-weight="700">FEATURES</text><text x="95" y="94" fill="#cffafe" font-size="12">Represent behaviour</text></g><path d="M716 184h30m-10-9 10 9-10 9" stroke="url(#arr)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(756 128)"><rect width="170" height="112" rx="15" fill="#10264b" stroke="#8b5cf6"/><text x="85" y="42" fill="#c4b5fd" font-size="14" font-weight="700">04</text><text x="85" y="72" fill="#fff" font-size="21" font-weight="700">MODEL</text><text x="85" y="94" fill="#ddd6fe" font-size="12">Train &amp; compare</text></g><path d="M934 184h30m-10-9 10 9-10 9" stroke="url(#arr)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(974 128)"><rect width="184" height="112" rx="15" fill="#10264b" stroke="#22c55e"/><text x="92" y="42" fill="#86efac" font-size="14" font-weight="700">05</text><text x="92" y="72" fill="#fff" font-size="21" font-weight="700">EVALUATE</text><text x="92" y="94" fill="#bbf7d0" font-size="12">Metrics &amp; error analysis</text></g></g></svg>